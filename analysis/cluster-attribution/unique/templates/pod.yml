apiVersion: v1
kind: Pod
metadata:
  name: test-pod-{{.Replica}}
  labels:
    num: "{{.Replica}}"
spec:
  containers:
  - name: webserver
    image: quay.io/cloud-bulldozer/sampleapp@sha256:baa1f409b3f55d577e9b5dbcbbe2e981489a6f037f20777f5733871aedd95754
    resources:
      requests:
        memory: "10Mi"
        cpu: "10m"
    imagePullPolicy: Always
    ports:
     - containerPort: 8080
       protocol: TCP
    securityContext:
       privileged: false
  - name: curlapp 
    image: quay.io/cloud-bulldozer/netpolvalidator@sha256:ba610feb115ddd2484c96de556246559e32200d799d802b307158c6c3a266518
    resources:
      requests:
        memory: "10Mi"
        cpu: "10m"
    imagePullPolicy: Always
    ports:
     - containerPort: 9001
       protocol: TCP
    securityContext:
       privileged: false
